[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "folderlake"
version = "0.2.0"
readme = "README.md"
description = "Point it at a folder. Know what's in it. A local file catalog with topics, metadata and a relationship graph, stored in one DuckDB file."
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "python-docx",
    "pypdf",
    "openpyxl",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
mcp = ["mcp>=1.0"]

[project.scripts]
folderlake = "folderlake.cli:main"
folderlake-mcp = "folderlake.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
folderlake = ["*.html", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
